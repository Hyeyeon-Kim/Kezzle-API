# Kezzle 홈 API 로컬/실험용 Prometheus 설정 (KAN-28)
# Docker Compose 내부 network에서 service 이름으로 scrape 한다.
global:
  scrape_interval: 5s
  evaluation_interval: 5s

rule_files:
  - /etc/prometheus/rules/home-recording.rules.yml
  - /etc/prometheus/rules/home-alert.rules.yml

scrape_configs:
  - job_name: prometheus
    static_configs:
      - targets: ["localhost:9090"]

  - job_name: kezzle-api
    metrics_path: /metrics
    static_configs:
      - targets: ["kezzle-api:3000"]

  - job_name: mongodb
    static_configs:
      - targets: ["mongodb-exporter:9216"]

  - job_name: redis
    static_configs:
      - targets: ["redis-exporter:9121"]
